upstream hisobchi_api { server api:3000; }
upstream hisobchi_bot { server bot:3001; }
upstream hisobchi_web { server web:80; }

server {
  listen 80;
  server_name app.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { proxy_pass http://hisobchi_web; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}

server {
  listen 80;
  server_name api.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /telegram/webhook { proxy_pass http://hisobchi_bot; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://hisobchi_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
